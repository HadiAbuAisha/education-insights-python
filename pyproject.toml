[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "education-insights"
version = "1.0.0"
description = "Reproducible, privacy-aware analysis of fictional academic performance data"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
education-insights = "education_insights.cli:main"

[tool.setuptools.packages.find]
include = ["education_insights*"]
